<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .logo-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      display: block;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 32px;
      color: #f1f5f9;
    }

    /* Step list */
    .steps {
      list-style: none;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #475569;
      transition: color 0.3s;
    }

    .step.active  { color: #e2e8f0; }
    .step.done    { color: #34d399; }
    .step.error   { color: #f87171; }

    .step-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 10px;
      transition: all 0.3s;
    }

    .step.active .step-icon {
      border-color: #6366f1;
      background: transparent;
    }

    /* Spinner inside active step icon */
    .step.active .step-icon::after {
      content: '';
      width: 10px;
      height: 10px;
      border: 2px solid #6366f1;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: block;
    }

    .step.done .step-icon {
      border-color: #34d399;
      background: #34d399;
      color: white;
    }
    .step.done .step-icon::after { content: '✓'; animation: none; border: none; font-size: 11px; font-weight: bold; }

    .step.error .step-icon {
      border-color: #f87171;
      background: #f87171;
      color: white;
    }
    .step.error .step-icon::after { content: '✕'; animation: none; border: none; font-size: 11px; font-weight: bold; }

    /* Progress bar */
    .progress-track {
      width: 280px;
      height: 3px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    /* Sub-status text (e.g. "Downloading FFmpeg... 42%") */
    #substatus {
      font-size: 12px;
      color: #64748b;
      height: 16px;
      text-align: center;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="./public/logo.png" alt="ShapCut Logo" />
  </div>
  <h1>ShapCut</h1>

  <ul class="steps" id="steps">
    <li class="step" id="step-ffmpeg">
      <div class="step-icon"></div>
      <span>Verifying FFmpeg</span>
    </li>
    <li class="step" id="step-backend">
      <div class="step-icon"></div>
      <span>Starting AI Engine</span>
    </li>
    <li class="step" id="step-ready">
      <div class="step-icon"></div>
      <span>Launching Editor</span>
    </li>
  </ul>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div id="substatus"></div>

  <script>
    const { ipcRenderer } = require('electron');

    function setStep(id, state) {
      const el = document.getElementById(id);
      if (!el) return;
      el.className = 'step ' + state;
    }

    function setProgress(pct) {
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function setSubStatus(text) {
      document.getElementById('substatus').textContent = text;
    }

    // Listen for structured step events from main process
    ipcRenderer.on('splash-step', (_, { step, state, sub, progress }) => {
      if (step)     setStep(step, state || 'active');
      if (sub)      setSubStatus(sub);
      if (progress !== undefined) setProgress(progress);
    });

    // Legacy text-only events for backwards compatibility
    ipcRenderer.on('download-status', (_, text) => {
      setSubStatus(text);
    });

    ipcRenderer.on('download-error', (_, text) => {
      setSubStatus(text);
      setStep('step-ffmpeg', 'error');
    });
  </script>
</body>
</html>
