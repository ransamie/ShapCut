name: Build ShapCut

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - uses: actions/checkout@v4

      - name: Setup System Libraries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies & PyInstaller
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller opencv-python mediapipe numpy
          
      - name: Build Python Backend (PyInstaller)
        working-directory: ./backend
        run: |
          pyinstaller --noconfirm shapcut_api.spec
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install
        
      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build
        
      - name: Copy Backend to ExtraResources
        working-directory: ./frontend
        shell: bash
        run: |
          mkdir -p build/backend
          cp -r ../backend/dist/shapcut_api/* build/backend/

      - name: Bundle FFmpeg Binaries (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./frontend
        shell: bash
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ffmpeg.zip
          cp ffmpeg-master-latest-win64-lgpl/bin/ffmpeg.exe build/backend/
          cp ffmpeg-master-latest-win64-lgpl/bin/ffprobe.exe build/backend/
          rm -rf ffmpeg.zip ffmpeg-master-latest-win64-lgpl

      - name: Bundle FFmpeg Binaries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./frontend
        shell: bash
        run: |
          curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg build/backend/
          cp ffmpeg-master-latest-linux64-lgpl/bin/ffprobe build/backend/
          chmod +x build/backend/ffmpeg build/backend/ffprobe
          chmod +x build/backend/shapcut_api
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-lgpl

      - name: Bundle FFmpeg Binaries (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./frontend
        shell: bash
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            brew install ffmpeg
          fi
          cp "$(which ffmpeg)" build/backend/ffmpeg
          cp "$(which ffprobe)" build/backend/ffprobe
          chmod +x build/backend/ffmpeg build/backend/ffprobe
          chmod +x build/backend/shapcut_api

      - name: Build Electron App
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ShapCut-Release-${{ matrix.os }}
          path: |
            frontend/dist_electron/*.exe
            frontend/dist_electron/*.dmg
            frontend/dist_electron/*.zip
            frontend/dist_electron/*.AppImage
